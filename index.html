<!doctype html>
<html lang="es"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fraganzé · Catálogo</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&amp;family=Jost:wght@300;400;500&amp;display=swap">
<style>
:root{--bg:#0a0a0a;--ink:#fff;--mute:#9b9b9b;--line:#2e2e2e;--card:#151515;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:300 15px/1.5 Jost,system-ui,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
:focus-visible{outline:2px solid #fff;outline-offset:3px}
button{font:inherit;cursor:pointer}
.hero{display:grid;place-items:center;padding:56px 24px 44px}
.hero img{width:min(78vw,420px);height:auto;animation:in 1.4s ease both}
@keyframes in{from{opacity:0;transform:translateY(10px)}}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:rgba(10,10,10,.94);backdrop-filter:blur(8px);border-block:1px solid var(--line)}
.in{max-width:1180px;margin:0 auto;padding:12px 24px;display:flex;flex-wrap:wrap;align-items:center;gap:10px 24px}
.mk svg{display:block;height:30px}
.chip{background:none;border:0;border-bottom:1px solid transparent;color:var(--mute);padding:6px 2px;margin-right:12px}
.chip[aria-pressed=true]{color:#fff;border-color:#fff}
#q{flex:1;min-width:150px;max-width:260px;background:none;border:0;border-bottom:1px solid var(--line);color:#fff;padding:6px 2px;font:inherit;border-radius:0}
#count{color:var(--mute);font-size:13px;margin-left:auto}
.btn{background:none;border:1px solid #fff;color:#fff;padding:9px 18px;letter-spacing:.06em}
.btn:disabled{opacity:.35;cursor:default}
main{max-width:1180px;margin:0 auto;padding:48px 24px 140px}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:60px 32px}
.card{text-align:center}
.fr{display:block;aspect-ratio:4/5;background:var(--card)}
label.fr{cursor:pointer}
.ph{display:grid;place-items:center;width:100%;height:100%;background:var(--card);overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover}
.drop{display:grid;justify-items:center;gap:10px;color:var(--mute)}
.drop svg{width:24px;fill:#3d3d3d}
.drop small{font-size:12px}
.brand{margin:22px 0 4px;font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--mute)}
h3{margin:0;font:500 25px/1.15 "Cormorant Garamond",serif}
.ml{margin:6px 0 0;color:var(--mute);font-size:13px;min-height:1.5em}
.rule{display:block;width:40px;height:1px;background:var(--ink);margin:12px auto 14px}
.price{margin:0;font:500 23px "Cormorant Garamond",serif}
.wa{display:inline-block;margin-top:16px;padding:10px 18px;background:#86cdf0;color:#0a0a0a;text-decoration:none;font-weight:500;font-size:14px;letter-spacing:.04em}
.wa:hover{background:#a8dcf5}
#cfg{max-width:380px;margin:0 auto 48px;text-align:center;color:var(--mute);font-size:13px}
.empty{grid-column:1/-1;text-align:center;color:var(--mute);padding:60px 0}
.e{display:block;width:100%;margin:10px 0 0;padding:6px 2px;background:none;border:0;border-bottom:1px solid var(--line);border-radius:0;color:var(--ink);font:inherit;text-align:center}
.e.nm{font:500 22px "Cormorant Garamond",serif}
.e option{background:#151515}
.row{display:flex;gap:10px}.row .e{min-width:0}
.del{margin-top:16px;background:none;border:0;color:var(--mute);text-decoration:underline;font-size:13px}
#ebar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:#fff;color:#000;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:center;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px))}
#ebar .btn{border-color:#000;color:#000}
#ebar .solid{background:#000;color:#fff}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style><style>artifact-sync,artifact-local{display:contents}</style><style>artifact-sync,artifact-local{display:contents}</style></head>

<script>
const SRC='<!doctype html>\n'+document.documentElement.outerHTML;
const $=s=>document.querySelector(s);
let S=JSON.parse($('#data').textContent),edit=false,cat='all',q='',art=null;
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=n=>n>0?'$ '+Number(n).toLocaleString('es-AR'):'Consultar';
const DROP='<svg viewBox="0 0 20 30" aria-hidden="true"><path d="M10 0C7 6 0 13 0 19a10 10 0 0 0 20 0C20 13 13 6 10 0Z"/></svg>';
const find=id=>S.items.find(x=>x.id==id);
const num=()=>String(S.wa||'').replace(/\D/g,'').replace(/^54(?!9)(\d{10})$/,'549$1');
const wa=p=>'https://wa.me/'+num()+'?text='+encodeURIComponent('Hola Fraganzé, quiero consultar por '+[p.brand,p.name].filter(Boolean).join(' ')+(p.ml?' ('+p.ml+' ml)':'')+'.');
function card(p){
  const ph=p.img?`<img src="${p.img}" alt="${esc(p.name)}" loading="lazy">`:`<span class="drop">${DROP}${edit?'<small>Subir foto</small>':''}</span>`;
  if(!edit)return `<article class="card"><div class="fr"><span class="ph">${ph}</span></div><p class="brand">${esc(p.brand)}</p><h3>${esc(p.name)}</h3><p class="ml">${p.ml?p.ml+' ml':''}</p><i class="rule"></i><p class="price">${fmt(p.price)}</p><a class="wa" href="${wa(p)}" target="_blank" rel="noopener">Consultar por WhatsApp</a></article>`;
  const o=(v,t)=>`<option value="${v}"${p.cat==v?' selected':''}>${t}</option>`;
  return `<article class="card" data-id="${p.id}"><label class="fr"><span class="ph">${ph}</span><input type="file" accept="image/*" hidden data-up="${p.id}"></label>
<input class="e" data-f="brand" value="${esc(p.brand)}" placeholder="Marca" aria-label="Marca"><input class="e nm" data-f="name" value="${esc(p.name)}" placeholder="Nombre del perfume" aria-label="Nombre">
<div class="row"><input class="e" data-f="ml" type="number" inputmode="numeric" min="0" value="${p.ml||''}" placeholder="ml" aria-label="Mililitros"><input class="e" data-f="price" type="number" inputmode="numeric" min="0" value="${p.price||''}" placeholder="Precio" aria-label="Precio"></div>
<select class="e" data-f="cat" aria-label="Categoría">${o('arabe','Árabe')}${o('dis','De diseñador')}</select><button class="del" data-del="${p.id}">Quitar perfume</button></article>`;
}
function render(){
  const l=edit?S.items:S.items.filter(p=>(cat=='all'||p.cat==cat)&&(p.name+' '+p.brand).toLowerCase().includes(q));
  $('#count').textContent=l.length+(l.length==1?' perfume':' perfumes');
  $('#grid').innerHTML=l.length?l.map(card).join(''):`<p class="empty">${S.items.length?'No hay perfumes con ese filtro.':'Todavía no hay perfumes cargados.'}</p>`;
}
const dirty=()=>{$('#save').disabled=false;$('#st').textContent='Hay cambios sin publicar'};
const shrink=f=>new Promise(r=>{const fr=new FileReader();fr.onload=()=>{const i=new Image();i.onload=()=>{const k=Math.min(1,800/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=Math.round(i.width*k);c.height=Math.round(i.height*k);c.getContext('2d').drawImage(i,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',.82))};i.src=fr.result};fr.readAsDataURL(f)});
const mode=on=>{edit=on;$('#ebar').hidden=!on;$('#cfg').hidden=!on;$('#wan').value=S.wa||'';$('#editbtn').hidden=on||!art;$('#chips').hidden=$('#q').hidden=on;render()};
$('#chips').onclick=e=>{const b=e.target.closest('[data-c]');if(!b)return;cat=b.dataset.c;document.querySelectorAll('.chip').forEach(x=>x.setAttribute('aria-pressed',x==b));render()};
$('#q').oninput=e=>{q=e.target.value.trim().toLowerCase();render()};
$('#grid').addEventListener('input',e=>{const t=e.target,c=t.closest('[data-id]');if(!t.dataset.f||!c)return;find(c.dataset.id)[t.dataset.f]=t.type=='number'?(+t.value||0):t.value;dirty()});
$('#grid').addEventListener('change',async e=>{const f=e.target.files&&e.target.files[0];if(!f)return;find(e.target.dataset.up).img=await shrink(f);render();dirty()});
$('#grid').addEventListener('click',e=>{const d=e.target.closest('[data-del]');if(!d)return;S.items=S.items.filter(x=>x.id!=d.dataset.del);render();dirty()});
$('#editbtn').onclick=()=>mode(true);
const old=t=>{const x=document.createElement('textarea');x.value=t;document.body.append(x);x.select();try{document.execCommand('copy')}catch(e){}x.remove()};
const copy=t=>{try{navigator.clipboard.writeText(t).catch(()=>old(t))}catch(e){old(t)}};
$('#grid').addEventListener('click',e=>{
  const c=e.target.closest('.cp');if(c){copy(c.dataset.n);c.textContent='Número copiado';return}
  const a=e.target.closest('.wa');if(!a)return;e.preventDefault();
  let w=null;try{w=window.open(a.href,'_blank')}catch(x){}
  if(w){w.opener=null;return}
  try{top.location.href=a.href}catch(x){}
  setTimeout(()=>{if(document.visibilityState!='visible'||a.nextElementSibling)return;a.insertAdjacentHTML('afterend','<p class="ml">WhatsApp no se abre desde esta página.<br>Escribinos al +'+num()+'<br><button class="del cp" data-n="+'+num()+'">Copiar número</button></p>')},900)});
$('#wan').oninput=e=>{S.wa=e.target.value.replace(/\D/g,'');dirty()};
$('#exit').onclick=()=>location.reload();
$('#add').onclick=()=>{S.items.unshift({id:Date.now().toString(36),name:'',brand:'',ml:0,price:0,cat:'arabe',img:''});render();dirty();scrollTo({top:$('#grid').offsetTop-90,behavior:'smooth'})};
$('#save').onclick=async()=>{
  $('#save').disabled=true;$('#st').textContent='Publicando…';
  const j=JSON.stringify(S).replace(/</g,'\\u003c');
  const html=SRC.replace(/(<script id="data" type="application\/json">)[\s\S]*?(<\/script>)/,(m,a,b)=>a+j+b);
  try{await art.publish(html)}catch(err){$('#save').disabled=false;$('#st').textContent=err&&err.code=='conflict'?'Alguien publicó antes que vos. Se recarga la página.':'No se pudo publicar. Probá de nuevo.'}
};
render();
(async()=>{try{const u=await claude.use('user');if(!u||!(await u.canEdit()))return;art=await claude.use('artifact');if(art)$('#editbtn').hidden=edit}catch(e){}})();
